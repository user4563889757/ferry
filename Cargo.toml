[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A tiny, resumable file ferry for your local network"
license = "MIT"
repository = "https://github.com/user4563889757/ferry"
readme = "README.md"
keywords = ["file-transfer", "lan", "resume", "self-hosted"]
categories = ["web-programming::http-server", "command-line-utilities"]

[dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
if-addrs = "0.13"
mime = "0.3"
mime_guess = "2"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
